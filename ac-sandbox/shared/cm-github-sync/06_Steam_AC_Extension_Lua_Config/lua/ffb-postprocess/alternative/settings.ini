[SETTINGS]
; Alternative FFB settings
sideForceK = 0.3 ; Side force; from 0 to 1, perc.
frontForceK = 0.4 ; Front force; from 0 to 1, perc.
suspTravelK = 0.15 ; Suspension travel force; from 0 to 1, perc.
dampK = 0.07 ; Damping; from 0 to 1, perc.
baseForceK = 1 ; Base force multiplier; from 1 to 5, round to 1
__HINT_BOTTOM=This script replaces FFB with a custom experimental implementation. If active, all other FFB settings, except for gain, will be ignored.<br><br>In case you prefer denser FFB, especially if your steering wheel uses gears (like most Logitech wheels), increase base force multiplier.
