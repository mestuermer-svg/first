; RSS IMSA Display On
[MODEL_REPLACEMENT_...]
FILE=rss_gtm_macca_72_evo_v8.kn5
INSERT=imsa_panel.kn5
INSERT_AFTER=ADDONS

[MODEL_REPLACEMENT_...]
FILE=rss_gtm_macca_72_evo_v8_LOD_B.kn5, rss_gtm_macca_72_evo_v8_LOD_C.kn5
INSERT=imsa_panel_lod.kn5
INSERT_AFTER=ADDONS

;//////////////////Lumirank Display 3D Mesh by RSS//////////////////////////
[DATA]
DISABLE_DIGITALPANELSINI = 1

[SHADER_REPLACEMENT_...]
MATERIALS = EXT_DIGITAL_PANEL_RSS
SHADER = ksPerPixelMultiMap_emissive
FILL_MISSING_TEXTURES = 1
PROP_... = emSkipDiffuseMap, 1
PROP_... = ksEmissive, 555, 555, 555

[LED_PANEL_...]
ACTIVE=1
MESHES = EXT_GEO_DIGITAL_PANELS_2
TEXTURE_SLOT = txEmissive
RESOLUTION = 1280, 1280
MASKS_PACK = rss_font_2.zip
DIGIT_0 = 22, 144, 633, 1075
DIGIT_1 = 628, 144, 633, 1075

BASE_COLOR = '#f01b29', 0.3
FLASHING_COLOR = '#f01b29', 0.4

ROLE_0 = POSITION
ROLE_1 = TEXT  
ROLE_1_TEXT = gt  
ROLE_2 = TEXT  
ROLE_2_TEXT = -m      

ROLE_DURATION = 5

; Hard-coded LED_PANEL_0 here
[LIGHT_LED_PANEL_0]
AFFECTS_TRACK=1
COLOR=0.1,0.1,0.1
RANGE=0.18

[EMISSIVE_...]
INPUT = EXTRA_E
NAME = DIGITAL_PANEL_RSS
COLOR = 555,555,555

[Pax_Display]
Mode="IMSA"