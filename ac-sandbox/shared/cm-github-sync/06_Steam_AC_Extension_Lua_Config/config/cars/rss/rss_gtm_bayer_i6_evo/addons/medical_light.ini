; RSS Medical_Lights
[MODEL_REPLACEMENT_...]
FILE=rss_gtm_bayer_i6_evo.kn5, rss_gtm_bayer_i6_evo_LOD_B.kn5, rss_gtm_bayer_i6_evo_LOD_C.kn5
INSERT=medical_light.kn5
INSERT_AFTER=EXT_MESHES

;---------------------------------------
; Medical Lights
;---------------------------------------
[SHARED_INPUT_...]
NAME = medical_damage_input
INPUT = BODY_DAMAGE
INPUT_SELECTOR = MAX
INPUT_THRESHOLD = 80

[SHARED_INPUT_...]
NAME = medical_manual_input
INPUT = EXTRA_F
INPUT_THRESHOLD = 1

[EMISSIVE_...]
NAME = GEO_Medical_SUB1
INPUT = 'calc:max(medical_damage_input, medical_manual_input)'
INPUT_THRESHOLD = 1
COLOR = 1,1,33,2
OFF_COLOR = 0,0,0
USE_SMOOTH_TRANSITION = 1
ACT_AS_HEADLIGHTS = 1