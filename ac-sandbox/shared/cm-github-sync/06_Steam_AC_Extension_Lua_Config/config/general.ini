; PRECREATE_MMF_DEVICE=1 ; Initialize extra D3D instance for MMF (might help if the initial moment of loading a video freezes AC); 1 or 0
HTTP_FLAGS=HTTP2, TLS13 ;; hidden
ADAPTER_NAME= ; Internet adapter name (if you have multiple internet connections and want to choose a specific one for AC, specify its name or IP address here. List multiple connections separated by a comma to fallback from the first one further if it’s not available. If value can be parsed as IP, it’ll be used as IP, otherwise it’ll be used as a filter matching with an adapter, where “?” matches with any number of symbols, so, for example, “Wi-Fi?” would match any adapter with a name starting with “Wi-Fi”. You can also use filters such as “wifi:yes”, or, for example, “{ wifi:no & ip:192.? }”. Currently, only IPv4 is supported here. Details about search are written in CSP log. If no matching adapters are found, default one will be used. If you’re creating a service running as a child process, IP address of selected adapter should be available as “ACCSP_PREFERRED_ADAPTER_IP” environment variable.);

[DEV]
; Developer settings
SILENT_LUA=0 ; Prevent Lua scripts from outputting debug data (unless Lua debug app has been used in a few previous sessions); 1 or 0
KEEP_BACKGROUND_WORKERS_AROUND=0 ; Keep Lua workers for (time to keep keep Lua background workers in Lua Debug app after they’re finished); from 0 s to 60, round to 1
FLAMES_ALWAYS_ON=0 ;; hidden
TRACK_CONDITIONS_RESTORE=0  ; set to 1 to stop lights from getting smoothly lit up when configs are changed; hidden
D3D_DEBUG=0 ;; hidden
GRACEFUL_START=3 ; skips rendering scene for the first N frames to make it easier for GPU to start; hidden
DISABLE_STEAM_INTERFACE=0 ;; hidden
LUA_APPS_DIR=lua ;; hidden
COUNT_LUA_MEMORY=0 ;; hidden
FORCE_LUA_PREPROCESSOR=1 ;; hidden
DISABLE_AUDIO=0 ;; hidden
DISABLE_TEXTURES=0 ;; hidden
BC7_COMPRESSION_LEVEL=3  ; from 0 to 6; hidden
LAZY_CLOUDS_GENERATION=1 ;; hidden
LAZY_MIPS_GENERATION=1 ;; hidden
PROFILE_LOADING=0 ;; hidden
PROFILE_MEMORY=0 ;; hidden
PROFILE_FREEZES_THRESHOLD=30 ; value in milliseconds for frames to show up; hidden
DISABLE_PROCESS_JOBS=0 ;; hidden
NANORT_SCENE_RAYCAST=0 ; Accelerate mesh-ray checks (speeds up raycasting used by Lua API or by apps such as Objects Inspector or Photo App’s click-to-focus, consumes around 50 MB of RAM per 1 million of triangles); 1 or 0; new
DX_DEVICE_PRIORITY=7 ;; hidden
CAR_PAINT_TEXTURE_NAMES=metal_details.dds, metal_detail.dds, Metal_detail.dds, car_paint.dds, carpaint_detail.dds ;; hidden
; EXTRACT_RESOURCES=C:/Temp/Resources
; SHADERS_DIR=C:/Temp/compiled_shaders
FMOD_LOGGING=0 ;; hidden
SAFE_EXIT=1 ; Safe exit (try disabling if AC isn’t saving something properly on exit, but it might mess up exiting process in other ways); 1 or 0
CRASH_ON_F12=0 ; could be useful to debug infinite loading; hidden
DISABLE_AI_SMOOTH_STEERING=0 ;; hidden