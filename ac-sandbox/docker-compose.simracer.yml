# Hochskalierte Docker-Compose-Konfiguration für die SimRacer-Workstation
# Hardware-Basis SimRacer: AMD Ryzen 9 3900X (12 Kerne / 24 Threads), 32 GB DDR4 RAM, 1 TB interne NVMe (C:) + 1.8 TB externe USB-SSD (D:)
# Empfohlener Live-Speicherort: C:\ac-sandbox (interne NVMe für maximale I/O-Geschwindigkeit & Schutz vor USB-Disconnects;
# in Veeam 'C:\ac-sandbox\storage\*' unter Exclusions eintragen; D:\Backups\ac-sandbox für Cold-Backups nutzen)

services:
  ac-windows-sandbox:
    image: dockurr/windows:latest
    container_name: ac-win11-sandbox
    environment:
      VERSION: "11"
      KVM: "N"
      RAM_SIZE: "12G"
      CPU_CORES: "8"
      DISK_SIZE: "160G"
      LANGUAGE: "German"
      REGION: "de-DE"
      KEYBOARD: "de-de"
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "0.0.0.0:8006:8006"
      - "0.0.0.0:3389:3389/tcp"
      - "0.0.0.0:3389:3389/udp"
      - "0.0.0.0:2222:22/tcp"
    volumes:
      - ./storage:/storage
      - ./shared:/shared
    stop_grace_period: 2m
    restart: unless-stopped
