# /etc/tlp.conf — Leise Lüfter bei Bildschirmschoner/Idle (Archibald IdeaPad 5)

# Polling-Intervalle reduzieren
POLLING_HDD_IDLE=30
POLLING_BAT=45

# Lüfter-Governor für leiseren Betrieb
ACFAN_GOVERNOR=schedutil
CPUFAN_GOVERNOR=schedutil

# Thermald-Schwellenwerte anpassen (weniger aggressiv)
START_THERMAL_LIMIT=75
STOP_THERMAL_LIMIT=65
THERMAL_STEP=2

# CPU-Freigabe bei Idle reduzieren
CPU_BOOST_ON_AC=1
CPU_SCALING_GOV=schedutil
