<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Render Erklärvideo</title><style>body{font:18px Segoe UI,Arial,sans-serif;background:#f5f7f8;color:#182431;padding:32px}button{font:inherit;padding:12px 20px;background:#176b87;color:white;border:0;border-radius:5px}#state{margin:18px 0;color:#526273}canvas{display:block;width:min(100%,960px);height:auto;border:1px solid #cbd8df}audio{display:none}</style></head><body><h1>Video-Render</h1><p>Erstellt eine lokale WebM-Datei aus den fünf Folien und Sprachaufnahmen.</p><button id="start">Video rendern</button><div id="state">Bereit</div><canvas id="stage" width="1280" height="720"></canvas><audio id="voice"></audio><script>
const state=document.querySelector('#state'),canvas=document.querySelector('#stage'),ctx=canvas.getContext('2d'),audio=document.querySelector('#voice');
const frames=[1,2,3,4,5].map(i=>`frames/slide-${i}.png`);const clips=[1,2,3,4,5].map(i=>`audio/narration-${i}.wav`);
function loadImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src})}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
document.querySelector('#start').addEventListener('click',async()=>{const button=document.querySelector('#start');button.disabled=true;let ac,src,dest,videoStream,recorder;try{state.textContent='Sprachspur und Videobilder werden vorbereitet …';ac=new AudioContext();await ac.resume();src=ac.createMediaElementSource(audio);dest=ac.createMediaStreamDestination();src.connect(dest);src.connect(ac.destination);videoStream=canvas.captureStream(30);for(const t of dest.stream.getAudioTracks())videoStream.addTrack(t);let mime='video/webm;codecs=vp9,opus';if(!MediaRecorder.isTypeSupported(mime))mime='video/webm;codecs=vp8,opus';if(!MediaRecorder.isTypeSupported(mime))throw new Error('Dieser Browser bietet keinen unterstützten WebM-Encoder.');const chunks=[];recorder=new MediaRecorder(videoStream,{mimeType:mime,videoBitsPerSecond:2200000,audioBitsPerSecond:128000});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};const stopped=new Promise(resolve=>{recorder.onstop=()=>resolve()});recorder.start(1000);for(let i=0;i<frames.length;i++){const im=await loadImage(frames[i]);ctx.drawImage(im,0,0,canvas.width,canvas.height);await wait(500);state.textContent=`Folie ${i+1} von ${frames.length} · Sprachspur läuft`;audio.src=clips[i];await audio.play();await new Promise((resolve,reject)=>{audio.onended=resolve;audio.onerror=()=>reject(new Error(`Audio ${i+1} konnte nicht gelesen werden.`))});await wait(850)}recorder.stop();await stopped;const blob=new Blob(chunks,{type:mime});if(blob.size<10000)throw new Error('Die Aufnahme ist leer.');const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='README-Lernmaterial-Erklaervideo.webm';a.click();state.textContent=`Fertig · ${(blob.size/1024/1024).toFixed(1)} MB · Download gestartet`;setTimeout(()=>URL.revokeObjectURL(url),60000);for(const t of videoStream.getTracks())t.stop();await ac.close()}catch(e){state.textContent='Fehler: '+e.message;button.disabled=false;try{if(recorder&&recorder.state!=='inactive')recorder.stop();if(videoStream)videoStream.getTracks().forEach(t=>t.stop());if(ac)await ac.close()}catch{}}});
</script></body></html>
