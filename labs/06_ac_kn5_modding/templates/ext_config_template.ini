; =============================================================================
; CSP Non-Destructive Extension Template (extension/ext_config.ini)
; Einsatzort: content/cars/<car_id>/extension/ext_config.ini
; Prinzip   : Materialien, Emissives und Shader überschreiben, OHNE die
;             originale .kn5-Binärdatei neu packen zu müssen.
; Hinweis   : Alle Material- und Mesh-Namen vorher mit inspect_kn5.py prüfen!
; =============================================================================

[INCLUDE]
; Standard-CSP-Presets für typische Fahrzeugkomponenten nach Bedarf aktivieren
; INCLUDE = common/materials_carpaint.ini
; INCLUDE = common/materials_glass.ini

[SHADER_REPLACEMENT_0]
; Beispiel: Carbon-Materialien gezielt verfeinern
; MATERIALS = MAT_CARBON_EXT, Carbon_Body
; PROP_0 = ksSpecularEXP, 45
; PROP_1 = ksSpecular, 0.35
; PROP_2 = ksAmbient, 0.25
; PROP_3 = ksDiffuse, 0.30

[SHADER_REPLACEMENT_1]
; Beispiel: Cockpit-Glas entspiegeln (VR-Lesbarkeit)
; MATERIALS = Windscreen, Glass_Cockpit
; PROP_0 = ksSpecular, 0.12
; PROP_1 = fresnelMaxLevel, 0.35

[EMISSIVE_BRAKE_0]
; Beispiel: Regen-/ERS-Rücklicht am Heckflügel bzw. Diffusor
; NAME = GEO_REAR_LIGHT
; COLOR = 40, 0, 0
; LAG = 0.85
; SIMULATE_HEATING = 0.2
; LOCATION = REAR

[DECAL_...]
; Hinweis: Nur aktive Sektionen auskommentieren, die im eigenen Zielmodell
; über inspect_kn5.py --file <modell>.kn5 verifiziert wurden.
